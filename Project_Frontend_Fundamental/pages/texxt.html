    <style>
        .gradient-custom-2 {


            background: #fccb90;
            background-image: url('https://portal.rikkei.edu.vn/assets/loginbanner2-Bve0DMOr.png');



            background: -webkit-linear-gradient(to right, #ffffff, #ffffff, #ffffff, #b44593);


        }

        #icon-login {
            background-color: #f70000;
            color: #ffffff;
            width: 310px;
            height: 40px;
            border-radius: 5px;
        }

        @media (min-width: 768px) {
            .gradient-form {

                        <div class="row g-0">
                            <div class="col-lg-6">
                                <div class="card-body p-md-5 mx-md-4">
                                    <select class="form-select" aria-label="Default select example"
                                        style="width: 50px;">
                                        <option selected>Ngôn ngữ</i>
                                        </option>
                                        <option value="1">VN</option>
                                        <option value="2">JPN</option>
                                    </select>


                                    <div class="text-center">

                                            style="width: 85px;" alt="logo">
                                        <h4 class="mt-1 mb-5 pb-1">We are The Lotus Team</h4>
                                    </div>

                                    <form>
                                        <p>Please login to your account</p>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <input type="email" id="form2Example11" class="form-control"
                                                placeholder="Phone number or email address" />
                                            <label class="form-label" for="form2Example11">Username</label>
                                        </div>

                                        <div data-mdb-input-init class="form-outline mb-4">
                                            <input type="password" id="form2Example22" class="form-control" />
                                            <label class="form-label" for="form2Example22">Password</label>
                                        </div>

                                        <div class="text-center pt-1 mb-5 pb-1">
                                            <button id="icon-login" type="button">Đăng nhập</button><br>
                                            <a class="text-muted" href="#!">Quên mật khẩukhẩu?</a>
                                        </div>

                                        <div class="d-flex align-items-center justify-content-center pb-4">
                                            <p class="mb-0 me-2">Bạn chưa có tài khoản?
                                            </p>
                                            <!-- <button type="button" data-mdb-button-init data-mdb-ripple-init
                                                class="btn btn-outline-danger">Create new</button> -->
                                            <a href="./register.html">Đăng ký</a>
                                        </div>

                                    </form>

                                </div>
                            </div>
                            <div class="col-lg-6 d-flex align-items-center gradient-custom-2">
                                <div class="text-white px-3 py-4 p-md-5 mx-md-4">

                                        do
                                        eiusmod

                                        quis
                                        nostrud

                                </div> -->
                                    <a href="../pages/login.html"></a>
                                </div>
                            </div>
                        </div>
                    </div>

            </div>
