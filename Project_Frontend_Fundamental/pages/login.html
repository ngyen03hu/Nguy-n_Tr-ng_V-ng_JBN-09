<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="login-container">
        <h2>Đăng nhập</h2>
        <p>Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>
        <form id="login-form">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" placeholder="Nhập email">

            <label for="password">Mật khẩu</label>
            <input class="input" type="password" id="password" placeholder="Nhập mật khẩu">

            <!-- Thêm dòng thông báo lỗi chung -->
            <div id="general-error" class="error-message" style="text-align: center;"></div>

            <div class="options">
                <label class="checkbox-container">
                    <input type="checkbox" id="remember">
                    <span>Nhớ tài khoản</span>
                </label>
                <a href="#">Quên mật khẩu?</a>
            </div>

            <button type="submit">Đăng nhập</button>
            <div id="snackbar"></div>
            <a href="../pages/category-manager.html"></a>

            <p class="register-text">Bạn chưa có tài khoản? <a href="../pages/register.html">Đăng ký</a></p>
        </form>
    </div>
    <script src="../js/login.js"></script>
</body>

</html>
